<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin — The Elo Edit</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="loginView" class="admin-login" style="display:none;">
  <h1>Admin login</h1>
  <form id="loginForm">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" required />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" required />
    </div>
    <button type="submit" class="submit-btn" id="loginBtn">Log in</button>
    <div class="status-msg" id="loginStatus"></div>
  </form>
</div>

<div id="dashboardView" class="page" style="display:none;">
  <header>
    <a href="#" id="logoutLink" class="logout-link">Log out</a>
    <h1>Curate the drop</h1>
    <p class="subtitle">Approve submissions, mark items sold.</p>
  </header>

  <button type="button" class="submit-btn" id="addListingToggle" style="margin-bottom:20px;">+ Add a listing manually</button>

  <div id="addListingPanel" style="display:none; margin-bottom:24px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px;">
    <div class="field">
      <label for="alPhotos">Photos*</label>
      <input type="file" id="alPhotos" accept="image/*" multiple />
      <p class="hint">Add up to a few photos. First one is the main photo (you can reorder later from the item's card).</p>
    </div>
    <div class="field">
      <label for="alBrand">Brand*</label>
      <input type="text" id="alBrand" placeholder="e.g. Reformation" />
    </div>
    <div class="field">
      <label for="alItemName">Item name</label>
      <input type="text" id="alItemName" placeholder="e.g. Juliette Midi Dress" />
    </div>
    <div class="two-col">
      <div class="field">
        <label for="alSize">Size*</label>
        <input type="text" id="alSize" placeholder="e.g. 4 / S" />
      </div>
      <div class="field">
        <label for="alPrice">Sell price ($)*</label>
        <input type="number" id="alPrice" min="0" step="1" placeholder="120" />
      </div>
    </div>
    <div class="two-col">
      <div class="field">
        <label for="alOriginalPrice">What was paid ($)</label>
        <input type="number" id="alOriginalPrice" min="0" step="1" placeholder="240" />
      </div>
      <div class="field">
        <label for="alCondition">Condition</label>
        <select id="alCondition">
          <option value="">Select…</option>
          <option>New with tags</option>
          <option>Like new</option>
          <option>Gently worn</option>
          <option>Well loved</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label for="alCategory">Category</label>
      <select id="alCategory">
        <option value="">Select…</option>
        <option>Dress</option>
        <option>Top</option>
        <option>Bottoms</option>
        <option>Outerwear</option>
        <option>Bag</option>
        <option>Shoes</option>
        <option>Accessory</option>
        <option>Other</option>
      </select>
    </div>
    <div class="field">
      <label for="alDescription">Description</label>
      <textarea id="alDescription" placeholder="Fit notes, fabric, why they're letting it go…"></textarea>
    </div>
    <div class="field">
      <label for="alSeller">Seller's Instagram handle*</label>
      <input type="text" id="alSeller" placeholder="@theirhandle" />
    </div>
    <button type="button" class="submit-btn" id="addListingSubmit">Add to Pending</button>
    <div class="status-msg" id="addListingStatus"></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="pending">Pending</button>
    <button class="tab-btn" data-tab="live">Live</button>
    <button class="tab-btn" data-tab="sold">Sold</button>
    <button class="tab-btn" data-tab="rejected">Rejected</button>
  </div>

  <div id="list"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shop — The Elo Edit</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" href="favicon.ico">
</head>
<body>

<div class="page">
  <header>
    <h1>Shop the Drops</h1>
    <p class="subtitle">Everything currently available, from every drop. Tap a piece to DM the seller.</p>
  </header>

  <div class="filter-bar" id="filterBar" style="display:none;">
    <select id="filterCategory"><option value="">Category</option></select>
    <select id="filterTag"><option value="">Tag</option></select>
    <select id="filterSize"><option value="">Size</option></select>
    <select id="filterPrice">
      <option value="">Price</option>
      <option value="0-100">Under $100</option>
      <option value="100-250">$100–250</option>
      <option value="250-500">$250–500</option>
      <option value="500-999999">$500+</option>
    </select>
  </div>

  <div id="shopGrid"><div class="empty-list">Loading…</div></div>

  <div class="nav-links" style="position:static; margin-top:24px;">
    <a href="index.html">← Back to today's drop</a> &nbsp;·&nbsp; <a href="submit.html">Sell something</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/shop.js"></script>
</body>
</html>
